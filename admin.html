<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUL Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

.card{
  width:calc(100% - 40px);
  max-width:400px;
  background:white;
  padding:32px;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.logo{
  width:56px;
  height:56px;
  border-radius:17px;
  background:#809CCF;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

h1{
  margin:0 0 8px;
  font-size:26px;
}

p{
  color:#6b7280;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  margin-top:7px;
  margin-bottom:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#809CCF;
  color:white;
  font-weight:700;
  font-size:15px;
}

button:disabled{
  opacity:.5;
}

#status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#f1f5f9;
  font-size:13px;
  white-space:pre-wrap;
}

#error{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#fff0f1;
  color:#dc3545;
  font-size:13px;
  white-space:pre-wrap;
}

#admin{
  text-align:center;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div id="login" class="card">

  <div class="logo">Q</div>

  <h1>QUL Admin</h1>

  <p>QUL Group 管理画面</p>

  <label>メールアドレス</label>
  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
    autocomplete="username"
  >

  <label>パスワード</label>
  <input
    id="password"
    type="password"
    placeholder="パスワード"
    autocomplete="current-password"
  >

  <button
    id="loginButton"
    type="button"
    onclick="login()"
  >
    ログイン
  </button>

  <div id="status">
    診断：JavaScript OK
  </div>

  <div id="error" class="hidden"></div>

</div>


<div id="admin" class="card hidden">

  <div class="logo">Q</div>

  <h1>ログイン成功</h1>

  <p>
    QUL Adminへのログインに成功しました。
  </p>

  <p id="userInfo"></p>

  <button
    type="button"
    onclick="logout()"
  >
    ログアウト
  </button>

</div>


<script>

const SUPABASE_URL =
"https://vfdqblzbdtxbuhjxzdoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";


let client;


/* =========================
   起動確認
========================= */

try{

  if(!window.supabase){

    throw new Error(
      "SupabaseのJavaScriptが読み込まれていません。"
    );

  }

  client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  document.getElementById("status").textContent =
    "診断：JavaScript OK\n" +
    "Supabase：読み込みOK\n" +
    "ログイン待機中";

}catch(e){

  document.getElementById("status").textContent =
    "診断エラー";

  document.getElementById("error").textContent =
    e.message;

  document.getElementById("error")
    .classList.remove("hidden");

}


/* =========================
   ログイン
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginButton");

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");


  error.classList.add("hidden");


  if(!email){

    error.textContent =
      "メールアドレスを入力してください。";

    error.classList.remove("hidden");

    return;

  }


  if(!password){

    error.textContent =
      "パスワードを入力してください。";

    error.classList.remove("hidden");

    return;

  }


  button.disabled = true;

  button.textContent =
    "ログイン中…";


  status.textContent =
    "① ボタン押下\n" +
    "② Supabaseへ接続中…";


  try{

    const result =
      await client.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(result.error){

      throw new Error(
        "Supabase認証エラー\n\n" +
        result.error.message
      );

    }


    if(!result.data.user){

      throw new Error(
        "ユーザー情報を取得できませんでした。"
      );

    }


    status.textContent =
      "③ 認証成功\n\n" +
      "ユーザーID：\n" +
      result.data.user.id;


    document.getElementById("userInfo").textContent =
      result.data.user.email || email;


    document
      .getElementById("login")
      .classList.add("hidden");


    document
      .getElementById("admin")
      .classList.remove("hidden");


  }catch(e){

    console.error(e);

    status.textContent =
      "ログイン処理でエラー";


    error.textContent =
      e.message;


    error.classList.remove("hidden");


    button.disabled = false;

    button.textContent =
      "ログイン";

  }

}


/* =========================
   ログアウト
========================= */

async function logout(){

  await client.auth.signOut();

  location.reload();

}

</script>

</body>
</html>
