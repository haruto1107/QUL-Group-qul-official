<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUL Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#809CCF;
  --dark:#172033;
  --bg:#f5f7fb;
  --card:#fff;
  --border:#e5e9f2;
  --danger:#e85d75;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--dark);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* Login */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  box-shadow:0 15px 45px rgba(20,35,65,.08);
}

.logo{
  font-size:32px;
  font-weight:800;
  letter-spacing:.05em;
  margin-bottom:6px;
}

.logo span{
  color:var(--blue);
}

.subtitle{
  color:#737b8c;
  margin-bottom:28px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(128,156,207,.15);
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  background:var(--blue);
  color:white;
  font-weight:700;
}

.primary:hover{
  opacity:.9;
}

.error{
  margin-top:14px;
  padding:11px 13px;
  border-radius:10px;
  background:#fff0f2;
  color:#c43f57;
  font-size:13px;
}

/* Admin */
#adminScreen{
  min-height:100vh;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  height:68px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.header-logo{
  font-size:22px;
  font-weight:800;
}

.header-logo span{
  color:var(--blue);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-email{
  font-size:13px;
  color:#737b8c;
}

.logout{
  border:1px solid var(--border);
  background:white;
  padding:8px 13px;
  border-radius:10px;
}

.container{
  width:min(1100px,calc(100% - 32px));
  margin:32px auto 60px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:24px;
}

.tab{
  border:1px solid var(--border);
  background:white;
  padding:10px 16px;
  border-radius:12px;
  white-space:nowrap;
}

.tab.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.panel h2{
  margin:0;
  font-size:20px;
}

.small{
  color:#7c8493;
  font-size:13px;
}

.list{
  display:grid;
  gap:12px;
}

.item{
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
}

.item-title{
  font-weight:750;
  margin-bottom:6px;
}

.item-meta{
  color:#7c8493;
  font-size:12px;
  margin-bottom:8px;
}

.item-body{
  color:#4d5667;
  white-space:pre-wrap;
  line-height:1.6;
}

.item-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.secondary,
.danger{
  border:1px solid var(--border);
  background:white;
  padding:8px 12px;
  border-radius:9px;
}

.danger{
  color:var(--danger);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.form-grid .full{
  grid-column:1 / -1;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.status{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#eef2f8;
  font-size:11px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#858d9b;
}

.notice{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#172033;
  color:white;
  padding:12px 16px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  z-index:100;
  max-width:320px;
}

@media(max-width:700px){
  .header{
    padding:0 16px;
  }

  .user-email{
    display:none;
  }

  .container{
    width:min(100% - 20px,1100px);
    margin-top:20px;
  }

  .panel{
    padding:18px;
    border-radius:17px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
  <div class="login-card">
    <div class="logo">QUL<span>.</span></div>
    <div class="subtitle">QUL Group 管理画面</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="primary" type="submit">
        ログイン
      </button>

      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>


<!-- ADMIN -->
<section id="adminScreen" class="hidden">

  <header class="header">
    <div class="header-logo">QUL<span> Admin</span></div>

    <div class="header-actions">
      <div id="userEmail" class="user-email"></div>
      <button id="logoutBtn" class="logout">ログアウト</button>
    </div>
  </header>

  <main class="container">

    <nav class="tabs">
      <button class="tab active" data-tab="news">ニュース</button>
      <button class="tab" data-tab="projects">プロジェクト</button>
      <button class="tab" data-tab="settings">サイト設定</button>
    </nav>


    <!-- NEWS -->
    <section id="newsPanel" class="panel">
      <div class="panel-head">
        <div>
          <h2>ニュース管理</h2>
          <div class="small">QUL公式サイトのニュースを管理</div>
        </div>
        <button id="newNewsBtn" class="primary" style="width:auto">
          ＋ 新規追加
        </button>
      </div>

      <div id="newsFormArea" class="hidden">
        <div class="panel" style="background:#f8f9fc">

          <form id="newsForm">

            <input type="hidden" id="newsId">

            <div class="form-grid">

              <div class="field full">
                <label>タイトル</label>
                <input id="newsTitle" required>
              </div>

              <div class="field full">
                <label>本文</label>
                <textarea id="newsBody"></textarea>
              </div>

              <div class="field">
                <label>公開日時</label>
                <input id="newsPublishedAt" type="datetime-local">
              </div>

              <div class="field">
                <label>公開状態</label>
                <label class="checkbox">
                  <input id="newsPublished" type="checkbox">
                  公開する
                </label>
              </div>

            </div>

            <div class="item-actions">
              <button class="primary" type="submit" style="width:auto">
                保存
              </button>

              <button type="button" id="cancelNewsBtn" class="secondary">
                キャンセル
              </button>
            </div>

          </form>
        </div>
      </div>

      <div id="newsList" class="list"></div>
    </section>


    <!-- PROJECTS -->
    <section id="projectsPanel" class="panel hidden">

      <div class="panel-head">
        <div>
          <h2>プロジェクト管理</h2>
          <div class="small">QULのプロジェクト情報を管理</div>
        </div>

        <button id="newProjectBtn" class="primary" style="width:auto">
          ＋ 新規追加
        </button>
      </div>

      <div id="projectFormArea" class="hidden">

        <div class="panel" style="background:#f8f9fc">

          <form id="projectForm">

            <input type="hidden" id="projectId">

            <div class="form-grid">

              <div class="field">
                <label>プロジェクト名</label>
                <input id="projectName" required>
              </div>

              <div class="field">
                <label>ステータス</label>
                <input id="projectStatus" placeholder="開発中 / 構想中 / 提供予定 など">
              </div>

              <div class="field full">
                <label>説明</label>
                <textarea id="projectDescription"></textarea>
              </div>

              <div class="field">
                <label>表示順</label>
                <input id="projectSort" type="number" value="0">
              </div>

              <div class="field">
                <label>表示設定</label>
                <label class="checkbox">
                  <input id="projectVisible" type="checkbox" checked>
                  サイトに表示する
                </label>
              </div>

            </div>

            <div class="item-actions">
              <button class="primary" type="submit" style="width:auto">
                保存
              </button>

              <button type="button" id="cancelProjectBtn" class="secondary">
                キャンセル
              </button>
            </div>

          </form>
        </div>
      </div>

      <div id="projectList" class="list"></div>

    </section>


    <!-- SETTINGS -->
    <section id="settingsPanel" class="panel hidden">

      <div class="panel-head">
        <div>
          <h2>サイト設定</h2>
          <div class="small">QUL公式サイトの基本情報</div>
        </div>
      </div>

      <form id="settingsForm">

        <div class="field">
          <label>サイト名</label>
          <input id="settingSiteName">
        </div>

        <div class="field">
          <label>サイト説明</label>
          <textarea id="settingSiteDescription"></textarea>
        </div>

        <div class="field">
          <label>キャッチコピー</label>
          <input id="settingCatchcopy">
        </div>

        <div class="field">
          <label>Vision</label>
          <textarea id="settingVision"></textarea>
        </div>

        <button class="primary" type="submit" style="width:auto">
          設定を保存
        </button>

      </form>

    </section>

  </main>

</section>

<div id="notice" class="notice hidden"></div>


<script>
/* ==============================
   Supabase
============================== */

const SUPABASE_URL =
  "https://vfdqblzbdtxbuhjxzdoq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==============================
   Elements
============================== */

const loginScreen = document.getElementById("loginScreen");
const adminScreen = document.getElementById("adminScreen");
const loginForm = document.getElementById("loginForm");
const loginError = document.getElementById("loginError");
const userEmail = document.getElementById("userEmail");

const newsPanel = document.getElementById("newsPanel");
const projectsPanel = document.getElementById("projectsPanel");
const settingsPanel = document.getElementById("settingsPanel");


/* ==============================
   Helpers
============================== */

function showNotice(message){
  const el = document.getElementById("notice");

  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(window.noticeTimer);

  window.noticeTimer = setTimeout(()=>{
    el.classList.add("hidden");
  },2500);
}

function showLoginError(message){
  loginError.textContent = message;
  loginError.classList.remove("hidden");
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){
  if(!value) return "";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleString("ja-JP");
}


/* ==============================
   Authentication
============================== */

async function checkSession(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(!session){
    showLogin();
    return;
  }

  await checkAdmin(session.user);
}


async function checkAdmin(user){

  const {
    data:profile,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,role")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);

    showLogin();

    showLoginError(
      "管理者情報を確認できませんでした。"
    );

    return;
  }

  if(!profile || profile.role !== "admin"){

    await supabaseClient.auth.signOut();

    showLogin();

    showLoginError(
      "このアカウントには管理者権限がありません。"
    );

    return;
  }

  showAdmin(user);
}


function showLogin(){

  loginScreen.classList.remove("hidden");
  adminScreen.classList.add("hidden");

  userEmail.textContent = "";
}


function showAdmin(user){

  loginScreen.classList.add("hidden");
  adminScreen.classList.remove("hidden");

  userEmail.textContent =
    user.email || "";

  loadNews();
}


/* Login */

loginForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  loginError.classList.add("hidden");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    loginForm.querySelector("button");

  button.disabled = true;
  button.textContent = "ログイン中…";

  try{

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      throw error;
    }

    if(!data.user){
      throw new Error("ユーザー情報を取得できませんでした");
    }

    await checkAdmin(data.user);

  }catch(error){

    console.error(error);

    showLoginError(
      error.message ||
      "ログインに失敗しました。"
    );

  }finally{

    button.disabled = false;
    button.textContent = "ログイン";

  }

});


/* Logout */

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

  await supabaseClient.auth.signOut();

  showLogin();

  showNotice("ログアウトしました");

});


/* ==============================
   Tabs
============================== */

document.querySelectorAll(".tab")
.forEach(tab=>{

  tab.addEventListener("click",()=>{

    document
      .querySelectorAll(".tab")
      .forEach(t=>t.classList.remove("active"));

    tab.classList.add("active");

    const target =
      tab.dataset.tab;

    newsPanel.classList.add("hidden");
    projectsPanel.classList.add("hidden");
    settingsPanel.classList.add("hidden");

    if(target === "news"){
      newsPanel.classList.remove("hidden");
      loadNews();
    }

    if(target === "projects"){
      projectsPanel.classList.remove("hidden");
      loadProjects();
    }

    if(target === "settings"){
      settingsPanel.classList.remove("hidden");
      loadSettings();
    }

  });

});


/* ==============================
   NEWS
============================== */

async function loadNews(){

  const list =
    document.getElementById("newsList");

  list.innerHTML =
    '<div class="empty">読み込み中…</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("news")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    list.innerHTML =
      `<div class="empty">
        ニュースを読み込めませんでした。<br>
        ${escapeHTML(error.message)}
      </div>`;

    return;
  }

  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="empty">ニュースはまだありません。</div>';

    return;
  }

  list.innerHTML =
    data.map(item=>`

      <article class="item">

        <div class="item-title">
          ${escapeHTML(item.title)}
        </div>

        <div class="item-meta">
          ${item.is_published ? "公開中" : "非公開"}
          ${item.published_at ? " ・ " + escapeHTML(formatDate(item.published_at)) : ""}
        </div>

        <div class="item-body">
          ${escapeHTML(item.body)}
        </div>

        <div class="item-actions">

          <button
            class="secondary"
            onclick="editNews('${item.id}')">
            編集
          </button>

          <button
            class="danger"
            onclick="deleteNews('${item.id}')">
            削除
          </button>

        </div>

      </article>

    `).join("");

}


document.getElementById("newNewsBtn")
.addEventListener("click",()=>{

  document.getElementById("newsForm").reset();

  document.getElementById("newsId").value = "";

  document.getElementById("newsFormArea")
    .classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


document.getElementById("cancelNewsBtn")
.addEventListener("click",()=>{

  document.getElementById("newsFormArea")
    .classList.add("hidden");

});


document.getElementById("newsForm")
.addEventListener("submit",async(e)=>{

  e.preventDefault();

  const id =
    document.getElementById("newsId").value;

  const title =
    document.getElementById("newsTitle").value.trim();

  const body =
    document.getElementById("newsBody").value.trim();

  const published =
    document.getElementById("newsPublished").checked;

  const publishedAtRaw =
    document.getElementById("newsPublishedAt").value;

  const publishedAt =
    publishedAtRaw
      ? new Date(publishedAtRaw).toISOString()
      : null;

  const payload = {
    title,
    body,
    is_published:published,
    published_at:publishedAt,
    updated_at:new Date().toISOString()
  };

  let result;

  if(id){

    result =
      await supabaseClient
        .from("news")
        .update(payload)
        .eq("id",id);

  }else{

    result =
      await supabaseClient
        .from("news")
        .insert(payload);

  }

  if(result.error){

    alert(
      "保存に失敗しました。\n\n" +
      result.error.message
    );

    return;
  }

  document.getElementById("newsFormArea")
    .classList.add("hidden");

  showNotice("ニュースを保存しました");

  loadNews();

});


window.editNews = async function(id){

  const {
    data,
    error
  } = await supabaseClient
    .from("news")
    .select("*")
    .eq("id",id)
    .single();

  if(error){

    alert(error.message);

    return;
  }

  document.getElementById("newsId").value =
    data.id;

  document.getElementById("newsTitle").value =
    data.title || "";

  document.getElementById("newsBody").value =
    data.body || "";

  document.getElementById("newsPublished").checked =
    !!data.is_published;

  if(data.published_at){

    const d =
      new Date(data.published_at);

    const local =
      new Date(
        d.getTime() -
        d.getTimezoneOffset()*60000
      )
      .toISOString()
      .slice(0,16);

    document.getElementById("newsPublishedAt").value =
      local;

  }else{

    document.getElementById("newsPublishedAt").value =
      "";

  }

  document.getElementById("newsFormArea")
    .classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


window.deleteNews = async function(id){

  if(!confirm("このニュースを削除しますか？")){
    return;
  }

  const {
    error
  } = await supabaseClient
    .from("news")
    .delete()
    .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  showNotice("ニュースを削除しました");

  loadNews();

};


/* ==============================
   PROJECTS
============================== */

async function loadProjects(){

  const list =
    document.getElementById("projectList");

  list.innerHTML =
    '<div class="empty">読み込み中…</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("projects")
    .select("*")
    .order("sort_order",{ascending:true})
    .order("created_at",{ascending:true});

  if(error){

    list.innerHTML =
