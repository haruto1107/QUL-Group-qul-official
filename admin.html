<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUL Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
    }

    .login-card {
      width: calc(100% - 32px);
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #809CCF;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: #777;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #809CCF;
      box-shadow: 0 0 0 3px rgba(128,156,207,.15);
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: #809CCF;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    #status {
      margin-top: 18px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }

    .error {
      color: #d33;
    }

    .success {
      color: #198754;
    }

    .debug {
      margin-top: 22px;
      padding: 12px;
      background: #f6f6f6;
      border-radius: 10px;
      font-size: 11px;
      color: #777;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="logo">QUL</div>

  <h1>管理画面</h1>
  <div class="subtitle">
    QUL Group Administration
  </div>

  <label for="email">メールアドレス</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="admin@example.com"
  >

  <label for="password">パスワード</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="パスワード"
  >

  <button id="loginButton" type="button">
    管理画面へログイン
  </button>

  <div id="status"></div>

  <div class="debug">
    JavaScript: <span id="jsStatus">確認中...</span>
  </div>

</div>

<script>
  /*
    QUL Supabase
  */

  const SUPABASE_URL =
    "https://vfdqblzbdtxbuhjxzdoq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";

  let supabaseClient = null;

  const statusEl = document.getElementById("status");
  const button = document.getElementById("loginButton");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  document.getElementById("jsStatus").textContent = "OK";

  /*
    Supabase初期化
  */
  try {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    statusEl.textContent = "ログインできます";
  } catch (error) {
    console.error(error);

    statusEl.textContent =
      "Supabaseの初期化に失敗しました";

    statusEl.className = "error";

    button.disabled = true;
  }

  /*
    ログイン
  */
  async function login() {

    if (!supabaseClient) {
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    statusEl.className = "";
    statusEl.textContent = "";

    if (!email) {
      statusEl.textContent =
        "メールアドレスを入力してください";
      statusEl.className = "error";
      emailInput.focus();
      return;
    }

    if (!password) {
      statusEl.textContent =
        "パスワードを入力してください";
      statusEl.className = "error";
      passwordInput.focus();
      return;
    }

    button.disabled = true;
    button.textContent = "ログイン中...";

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      if (!data || !data.session) {
        throw new Error(
          "ログインセッションを取得できませんでした"
        );
      }

      statusEl.textContent =
        "ログイン成功。管理画面を開いています...";
      statusEl.className = "success";

      /*
        重要
        管理画面は別ページにする
      */
      setTimeout(() => {

        window.location.href =
          window.location.origin +
          "/admin-dashboard.html";

      }, 500);

    } catch (error) {

      console.error(error);

      statusEl.textContent =
        "ログインできませんでした: " +
        (error.message || "不明なエラー");

      statusEl.className = "error";

      button.disabled = false;
      button.textContent = "管理画面へログイン";
    }
  }

  /*
    ボタン
  */
  button.addEventListener("click", login);

  /*
    Enterでもログイン
  */
  passwordInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      event.preventDefault();
      login();
    }

  });

</script>

</body>
</html>
