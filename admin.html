<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUL Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  padding:32px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 60px #00000012;
}

.logo{
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:17px;
  background:#809CCF;
  color:#fff;
  font-size:25px;
  font-weight:800;
  margin-bottom:20px;
}

h1,h2,h3{margin-top:0}

.subtitle{
  color:#6b7280;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:14px 0 6px;
}

input,textarea,select{
  width:100%;
  padding:12px 13px;
  border:1px solid #dfe3ea;
  border-radius:12px;
  background:#fff;
  outline:none;
}

textarea{
  min-height:130px;
  resize:vertical;
}

input:focus,textarea:focus,select:focus{
  border-color:#809CCF;
  box-shadow:0 0 0 3px #809CCF22;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#809CCF;
  color:#fff;
  font-weight:700;
  margin-top:18px;
}

.primary:disabled{
  opacity:.5;
}

.error{
  margin-top:14px;
  padding:12px;
  background:#fff0f0;
  color:#c62828;
  border-radius:10px;
  font-size:13px;
  white-space:pre-wrap;
}

/* ADMIN */

#adminScreen{
  min-height:100vh;
}

.topbar{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:#ffffffee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #e7eaf0;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:#809CCF;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}

.logout{
  padding:8px 12px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px 60px;
}

.page-title p{
  color:#6b7280;
  margin-top:5px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:25px 0 18px;
}

.tab{
  white-space:nowrap;
  padding:10px 16px;
  border:1px solid #e0e4ea;
  background:#fff;
  border-radius:12px;
}

.tab.active{
  background:#809CCF;
  border-color:#809CCF;
  color:#fff;
}

.panel{
  background:#fff;
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 30px #00000008;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.panel-head h3{
  margin:0;
}

.small-btn{
  padding:9px 13px;
  border:1px solid #dfe3ea;
  background:#fff;
  border-radius:10px;
}

.item{
  border:1px solid #e5e8ed;
  border-radius:14px;
  padding:16px;
  margin-bottom:10px;
}

.item:last-child{
  margin-bottom:0;
}

.item-title{
  font-weight:700;
}

.item-meta{
  color:#6b7280;
  font-size:13px;
  margin-top:7px;
  white-space:pre-wrap;
}

.item-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.danger{
  color:#c62828;
  border-color:#f1cccc;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  background:#eef1f5;
  font-size:11px;
  margin-left:6px;
}

.badge-on{
  background:#eaf6ee;
  color:#27733e;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:35px 10px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#eaf6ee;
  color:#27733e;
  font-size:13px;
}

.modal-bg{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#0006;
  z-index:100;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  padding:25px;
  background:#fff;
  border-radius:20px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ddd;
  background:#fff;
}

.modal-actions .save{
  background:#809CCF;
  border-color:#809CCF;
  color:#fff;
}

.notice{
  padding:13px;
  background:#f3f6fa;
  border-radius:12px;
  color:#4b5563;
  font-size:13px;
  margin-bottom:18px;
}

@media(max-width:600px){

  .topbar{
    padding:0 15px;
  }

  .user-area span{
    display:none;
  }

  .container{
    padding:20px 14px 50px;
  }

  .panel{
    padding:17px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="login-card">

    <div class="logo">Q</div>

    <h1>QUL Admin</h1>

    <div class="subtitle">
      QUL Group 管理画面
    </div>

    <label>メールアドレス</label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="メールアドレス"
    >

    <label>パスワード</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="パスワード"
    >

    <button
      id="loginButton"
      class="primary"
      type="button"
    >
      ログイン
    </button>

    <div id="loginError" class="error hidden"></div>

  </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="adminScreen" class="hidden">

<header class="topbar">

  <div class="brand">
    QUL <span>Admin</span>
  </div>

  <div class="user-area">

    <span id="userEmail"></span>

    <button
      class="logout"
      id="logoutButton"
    >
      ログアウト
    </button>

  </div>

</header>


<main class="container">

  <div class="page-title">

    <h2>管理画面</h2>

    <p>
      QUL公式サイトのコンテンツを管理します。
    </p>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button class="tab active" data-tab="news">
      📰 ニュース
    </button>

    <button class="tab" data-tab="projects">
      🚀 プロジェクト
    </button>

    <button class="tab" data-tab="settings">
      ⚙️ サイト設定
    </button>

    <button class="tab" data-tab="reserve">
      📅 予約
    </button>

  </div>


  <!-- NEWS -->

  <section
    id="newsPanel"
    class="panel"
  >

    <div class="panel-head">

      <h3>ニュース</h3>

      <button
        class="small-btn"
        id="addNewsButton"
      >
        ＋ ニュース追加
      </button>

    </div>

    <div id="newsList">
      読み込み中…
    </div>

  </section>


  <!-- PROJECTS -->

  <section
    id="projectsPanel"
    class="panel hidden"
  >

    <div class="panel-head">

      <h3>プロジェクト</h3>

      <button
        class="small-btn"
        id="addProjectButton"
      >
        ＋ プロジェクト追加
      </button>

    </div>

    <div id="projectsList">
      読み込み中…
    </div>

  </section>


  <!-- SETTINGS -->

  <section
    id="settingsPanel"
    class="panel hidden"
  >

    <div class="panel-head">

      <h3>サイト設定</h3>

    </div>

    <div class="notice">
      QUL公式サイトで使用する基本情報を編集できます。
    </div>

    <label>サイト名</label>

    <input id="settingSiteName">

    <label>サイト説明</label>

    <textarea id="settingDescription"></textarea>

    <label>キャッチコピー</label>

    <input id="settingCatchcopy">

    <label>Vision</label>

    <textarea id="settingVision"></textarea>

    <button
      class="primary"
      id="saveSettingsButton"
    >
      設定を保存
    </button>

    <div
      id="settingsMessage"
      class="message hidden"
    >
      保存しました。
    </div>

  </section>


  <!-- RESERVE -->

  <section
    id="reservePanel"
    class="panel hidden"
  >

    <h3>予約</h3>

    <div class="notice">
      QUL Groupの予約ページを確認できます。
    </div>

    <button
      class="primary"
      id="reserveButton"
    >
      予約ページを開く
    </button>

  </section>

</main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  id="modalBg"
  class="modal-bg hidden"
>

  <div class="modal">

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://vfdqblzbdtxbuhjxzdoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginScreen =
document.getElementById("loginScreen");

const adminScreen =
document.getElementById("adminScreen");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");


/* =========================================
   LOGIN
========================================= */

loginButton.addEventListener(
  "click",
  login
);


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    e=>{

      if(e.key === "Enter"){

        login();

      }

    }
  );


async function login(){

  loginError.classList.add("hidden");

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    loginError.textContent =
      "メールアドレスとパスワードを入力してください。";

    loginError.classList.remove("hidden");

    return;

  }


  loginButton.disabled = true;

  loginButton.textContent =
    "ログイン中…";


  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


    if(error){

      throw error;

    }


    if(!data.user){

      throw new Error(
        "ユーザー情報を取得できませんでした。"
      );

    }


    showAdmin(data.user);


  }catch(error){

    console.error(error);

    loginError.textContent =
      error.message;

    loginError.classList.remove("hidden");

    loginButton.disabled = false;

    loginButton.textContent =
      "ログイン";

  }

}


/* =========================================
   ADMIN DISPLAY
========================================= */

function showAdmin(user){

  loginScreen.classList.add("hidden");

  adminScreen.classList.remove("hidden");

  document
    .getElementById("userEmail")
    .textContent =
      user.email || "";

  loadNews();

}


/* =========================================
   SESSION
========================================= */

window.addEventListener(
  "load",
  async()=>{

    const {
      data
    } =
    await supabaseClient.auth
      .getSession();

    if(data.session){

      showAdmin(
        data.session.user
      );

    }

  }
);


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async()=>{

      await supabaseClient.auth.signOut();

      location.reload();

    }
  );


/* =========================================
   TABS
========================================= */

document
  .querySelectorAll(".tab")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".tab")
          .forEach(x=>
            x.classList.remove("active")
          );

        button.classList.add("active");


        const tab =
          button.dataset.tab;


        document
          .getElementById("newsPanel")
          .classList.add("hidden");

        document
          .getElementById("projectsPanel")
          .classList.add("hidden");

        document
          .getElementById("settingsPanel")
          .classList.add("hidden");

        document
          .getElementById("reservePanel")
          .classList.add("hidden");


        if(tab === "news"){

          document
            .getElementById("newsPanel")
            .classList.remove("hidden");

          loadNews();

        }

        if(tab === "projects"){

          document
            .getElementById("projectsPanel")
            .classList.remove("hidden");

          loadProjects();

        }

        if(tab === "settings"){

          document
            .getElementById("settingsPanel")
            .classList.remove("hidden");

          loadSettings();

        }

        if(tab === "reserve"){

          document
            .getElementById("reservePanel")
            .classList.remove("hidden");

        }

      }
    );

  });


/* =========================================
   NEWS
========================================= */

async function loadNews(){

  const list =
    document.getElementById("newsList");

  list.textContent =
    "読み込み中…";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("news")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    list.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

    return;

  }


  if(!data.length){

    list.innerHTML =
      `<div class="empty">
        ニュースはまだありません。
      </div>`;

    return;

  }


  list.innerHTML =
    data.map(item=>`

      <div class="item">

        <div class="item-title">

          ${escapeHtml(item.title || "無題")}

          <span class="badge ${
            item.is_published
              ? "badge-on"
              : ""
          }">

            ${item.is_published
              ? "公開"
              : "非公開"}

          </span>

        </div>

        <div class="item-meta">
          ${escapeHtml(item.body || "")}
        </div>

        <div class="item-actions">

          <button
            class="small-btn"
            onclick="editNews('${item.id}')"
          >
            編集
          </button>

          <button
            class="small-btn danger"
            onclick="deleteNews('${item.id}')"
          >
            削除
          </button>

        </div>

      </div>

    `).join("");

}


document
  .getElementById("addNewsButton")
  .addEventListener(
    "click",
    ()=>openNewsModal()
  );


async function editNews(id){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("news")
    .select("*")
    .eq("id",id)
    .single();


  if(error){

    alert(error.message);

    return;

  }


  openNewsModal(data);

}


function openNewsModal(item=null){

  document
    .getElementById("modalContent")
    .innerHTML = `

      <h3>
        ${item ? "ニュース編集" : "ニュース追加"}
      </h3>

      <label>タイトル</label>

      <input
        id="newsTitle"
        value="${attr(item?.title || "")}"
      >

      <label>本文</label>

      <textarea id="newsBody">${escapeHtml(item?.body || "")}</textarea>

      <label>

        <input
          id="newsPublished"
          type="checkbox"
          ${item?.is_published ? "checked" : ""}
          style="width:auto"
        >

        公開する

      </label>

      <div class="modal-actions">

        <button
          onclick="closeModal()"
        >
          キャンセル
        </button>

        <button
          class="save"
          onclick="saveNews('${item?.id || ""}')"
        >
          保存
        </button>

      </div>

    `;


  openModal();

}


async function saveNews(id){

  const title =
    document
      .getElementById("newsTitle")
      .value
      .trim();

  const body =
    document
      .getElementById("newsBody")
      .value
      .trim();

  const is_published =
    document
      .getElementById("newsPublished")
      .checked;


  if(!title){

    alert("タイトルを入力してください。");

    return;

  }


  const payload = {

    title,
    body,
    is_published,
    updated_at:
      new Date().toISOString()

  };


  let result;


  if(id){

    result =
      await supabaseClient
        .from("news")
        .update(payload)
        .eq("id",id);

  }else{

    result =
      await supabaseClient
        .from("news")
        .insert({

          ...payload,

          published_at:
            is_published
              ? new Date().toISOString()
              : null

        });

  }


  if(result.error){

    alert(
      "保存失敗\n\n" +
      result.error.message
    );

    return;

  }


  closeModal();

  loadNews();

}


async function deleteNews(id){

  if(!confirm(
    "このニュースを削除しますか？"
  )) return;


  const {
    error
  } =
  await supabaseClient
    .from("news")
    .delete()
    .eq("id",id);


  if(error){

    alert(error.message);

    return;

  }


  loadNews();

}


/* =========================================
   PROJECTS
========================================= */

async function loadProjects(){

  const list =
    document.getElementById(
      "projectsList"
    );

  list.textContent =
    "読み込み中…";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("projects")
    .select("*")
    .order(
      "sort_order",
      {ascending:true}
    );


  if(error){

    list.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

    return;

  }


  if(!data.length){

    list.innerHTML =
      `<div class="empty">
        プロジェクトはありません。
      </div>`;

    return;

  }


  list.innerHTML =
    data.map(item=>`

      <div class="item">

        <div class="item-title">

          ${escapeHtml(item.name || "無題")}

          <span class="badge">
            ${escapeHtml(item.status || "")}
          </span>

        </div>

        <div class="item-meta">

          ${escapeHtml(item.description || "")}

          <br>

          ${item.is_visible
            ? "表示中"
            : "非表示"}

        </div>

        <div class="item-actions">

          <button
            class="small-btn"
            onclick="editProject('${item.id}')"
          >
            編集
          </button>

          <button
            class="small-btn danger"
            onclick="deleteProject('${item.id}')"
          >
            削除
          </button>

        </div>

      </div>

    `).join("");

}


document
  .getElementById("addProjectButton")
  .addEventListener(
    "click",
    ()=>openProjectModal()
  );


async function editProject(id){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("projects")
    .select("*")
    .eq("id",id)
    .single();


  if(error){

    alert(error.message);

    return;

  }


  openProjectModal(data);

}


function openProjectModal(item=null){

  document
    .getElementById("modalContent")
    .innerHTML = `

      <h3>
        ${item
          ? "プロジェクト編集"
          : "プロジェクト追加"}
      </h3>

      <label>名前</label>

      <input
        id="projectName"
        value="${attr(item?.name || "")}"
      >

      <label>説明</label>

      <textarea
        id="projectDescription"
      >${escapeHtml(item?.description || "")}</textarea>

      <div class="form-grid">

        <div>

          <label>ステータス</label>

          <input
            id="projectStatus"
            value="${attr(item?.status || "")}"
            placeholder="開発中"
          >

        </div>

        <div>

          <label>表示順</label>

          <input
            id="projectOrder"
            type="number"
            value="${item?.sort_order ?? 0}"
          >

        </div>

      </div>

      <label>

        <input
          id="projectVisible"
          type="checkbox"
          ${item?.is_visible !== false
            ? "checked"
            : ""}
          style="width:auto"
        >

        公式サイトに表示する

      </label>

      <div class="modal-actions">

        <button
          onclick="closeModal()"
        >
          キャンセル
        </button>

        <button
          class="save"
          onclick="saveProject('${item?.id || ""}')"
        >
          保存
