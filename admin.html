<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUL Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
    "Noto Sans JP","Helvetica Neue",Arial,sans-serif;
  background:#f5f7fb;
  color:#111;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  height:64px;
  background:#809CCF;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}

.header-logout{
  background:rgba(255,255,255,.18);
  border:0;
  color:#fff;
  padding:8px 12px;
  border-radius:9px;
}

/* LOGIN */

#login{
  min-height:calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 18px;
}

.login-box{
  width:min(430px,100%);
  background:#fff;
  padding:28px;
  border-radius:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.08);
}

.login-box h1{
  margin:0 0 8px;
}

.login-box p{
  color:#666;
}

.login-input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:11px;
  margin:6px 0 14px;
  outline:none;
}

.login-input:focus{
  border-color:#809CCF;
}

.primary{
  width:100%;
  border:0;
  background:#809CCF;
  color:#fff;
  padding:14px;
  border-radius:11px;
  font-weight:700;
}

#loginStatus{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#f1f3f6;
  font-size:13px;
  white-space:pre-wrap;
}

/* ADMIN */

#admin{
  display:none;
}

.layout{
  max-width:1200px;
  margin:auto;
  padding:24px 18px 60px;
  display:grid;
  grid-template-columns:220px 1fr;
  gap:20px;
}

.sidebar{
  background:#fff;
  border-radius:18px;
  padding:10px;
  height:max-content;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.side-button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:13px;
  border-radius:10px;
  margin-bottom:5px;
  font-weight:600;
}

.side-button:hover{
  background:#f0f3f8;
}

.side-button.active{
  background:#809CCF;
  color:#fff;
}

.content{
  min-width:0;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.page-title{
  margin-bottom:20px;
}

.page-title h1{
  margin:0 0 5px;
  font-size:28px;
}

.page-title p{
  margin:0;
  color:#777;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
  margin-bottom:15px;
}

.action-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.action-button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#809CCF;
  color:#fff;
  font-weight:700;
}

.gray-button{
  background:#eef1f5;
  color:#222;
}

.danger-button{
  background:#222;
  color:#fff;
}

.item{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.item-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:7px;
}

.item-description{
  white-space:pre-wrap;
  color:#555;
  margin:10px 0;
}

.meta{
  color:#777;
  font-size:12px;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  background:#edf1f7;
  border-radius:20px;
  margin-right:5px;
}

.empty{
  text-align:center;
  padding:35px;
  color:#777;
  background:#fff;
  border-radius:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

.field{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:15px;
}

textarea.field{
  min-height:120px;
  resize:vertical;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:15px;
}

.checkbox input{
  width:auto;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.45);
  z-index:100;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:24px;
}

.modal-box h2{
  margin-top:0;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
}

.modal-actions button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:0 14px;
  }

  .header-right{
    font-size:11px;
  }

  .layout{
    grid-template-columns:1fr;
    padding:15px 12px 40px;
  }

  .sidebar{
    display:flex;
    overflow-x:auto;
    gap:5px;
  }

  .side-button{
    white-space:nowrap;
    width:auto;
    margin:0;
  }

  .page-title h1{
    font-size:23px;
  }

}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">
    QUL Admin
  </div>

  <div class="header-right">

    <span id="headerEmail"></span>

    <button
      class="header-logout"
      onclick="logout()"
    >
      ログアウト
    </button>

  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<section id="login">

  <div class="login-box">

    <p>
      QUL管理者アカウントでログインしてください。

<!-- =========================

<!-- =========================
     PROJECT MODAL
========================= -->

>

<!-- =========================

========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   CONFIG
========================= */

const SUPABASE_URL =
"https://vfdqblzbdtxbuhjxzdoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";

let supabaseClient = null;


/* =========================
   INIT
========================= */

document.getElementById("loginStatus").textContent =
"JavaScript OK";

try{

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  document.getElementById("loginStatus").textContent =
  "JavaScript OK\nSupabase OK\nログインできます。";

}catch(error){

  console.error(error);

  document.getElementById("loginStatus").textContent =
  "Supabase初期化エラー\n\n" +
  error.message;

}


/* =========================
   LOGIN
========================= */

async function login(){

  const status =
    document.getElementById("loginStatus");

  const button =
    document.getElementById("loginButton");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!supabaseClient){

    status.textContent =
    "Supabaseが初期化されていません。";

    return;

  }

  if(!email){

    status.textContent =
    "メールアドレスを入力してください。";

    return;

  }

  if(!password){

    status.textContent =
    "パスワードを入力してください。";

    return;

  }

  button.disabled = true;

  button.textContent =
  "ログイン中…";

  status.textContent =
  "ログインしています…";

  try{

    const result =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });

    if(result.error){

      throw result.error;

    }

    if(!result.data.user){

      throw new Error(
        "ユーザー情報を取得できませんでした。"
      );

    }

    status.textContent =
    "ログイン成功！";

    showAdmin(
      result.data.user
    );

  }catch(error){

    console.error(error);

    status.textContent =
    "ログイン失敗\n\n" +
    error.message;

  }finally{

    button.disabled = false;

    button.textContent =
    "ログイン";

  }

}


/* =========================
   ADMIN DISPLAY
========================= */

function showAdmin(user){

  document.getElementById("login").style.display =
  "none";

  document.getElementById("admin").style.display =
  "block";

  document.getElementById("headerEmail").textContent =
  user.email || "";

  /*
   * 管理画面を先に表示。
   * 権限確認やデータ読み込みで
   * ログイン画面に戻ることはありません。
   */

  loadNews();

  loadProjects();

  loadSettings();

}


/* =========================
   SESSION
========================= */

(async function(){

  if(!supabaseClient) return;

  try{

    const result =
      await supabaseClient.auth.getSession();

    if(
      result.data &&
      result.data.session &&
      result.data.session.user
    ){

      showAdmin(
        result.data.session.user
      );

    }

  }catch(error){

    console.error(error);

  }

})();


/* =========================
   PANEL
========================= */

function showPanel(name,button){

  document
    .querySelectorAll(".panel")
    .forEach(function(panel){

      panel.classList.remove("active");

    });

  document
    .getElementById("panel-" + name)
    .classList.add("active");

  document
    .querySelectorAll(".side-button")
    .forEach(function(btn){

      btn.classList.remove("active");

    });

  if(button){

    button.classList.add("active");

  }

}


function showPanelByName(name){

  const buttons =
    document.querySelectorAll(".side-button");

  let target = null;

  buttons.forEach(function(button){

    if(
      button.textContent.includes(
        name === "news"
          ? "ニュース"
          : name === "projects"
          ? "プロジェクト"
          : "サイト設定"
      )
    ){

      target = button;

    }

  });

  showPanel(
    name,
    target
  );

}


/* =========================
   NEWS
========================= */

async function loadNews(){

  const list =
    document.getElementById("newsList");

  if(!list) return;

  list.textContent =
  "読み込み中…";

  try{

    const result =
      await supabaseClient
        .from("news")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        );

    if(result.error){

      throw result.error;

    }

    const rows =
      result.data || [];

    if(rows.length === 0){

      list.innerHTML =
      '<div class="empty">ニュースはまだありません。</div>';

      return;

    }

    list.innerHTML =
      rows.map(function(row){

        const safeRow =
          encodeURIComponent(
            JSON.stringify(row)
          );

        return `

          <div class="item">

            <div class="item-title">
              ${escapeHTML(row.title || "無題")}
            </div>

            <div class="meta">

              <span class="badge">
                ${
                  row.is_published
                  ? "公開"
                  : "非公開"
                }
              </span>

              ${
                row.created_at
                ? escapeHTML(
                    new Date(
                      row.created_at
                    ).toLocaleString("ja-JP")
                  )
                : ""
              }

            </div>

            <div class="item-description">
              ${escapeHTML(row.body || "")}
            </div>

            <div class="action-row">

              <button
                class="action-button"
                onclick="editNewsEncoded('${safeRow}')"
              >
                編集
              </button>

              <button
                class="action-button danger-button"
                onclick="deleteNews('${row.id}')"
              >
                削除
              </button>

            </div>

          </div>

        `;

      }).join("");

  }catch(error){

    console.error(error);

    list.innerHTML =
    '<div class="empty">読み込みエラー：' +
    escapeHTML(error.message) +
    '</div>';

  }

}


function newNews(){

  document.getElementById("newsModalTitle").textContent =
  "ニュースを追加";

  document.getElementById("newsId").value =
  "";

  document.getElementById("newsTitle").value =
  "";

  document.getElementById("newsBody").value =
  "";

  document.getElementById("newsPublished").checked =
  true;

  document.getElementById("newsModal")
    .classList.add("open");

}


function editNewsEncoded(encoded){

  try{

    const row =
      JSON.parse(
        decodeURIComponent(encoded)
      );

    document.getElementById("newsModalTitle").textContent =
    "ニュースを編集";

    document.getElementById("newsId").value =
    row.id || "";

    document.getElementById("newsTitle").value =
    row.title || "";

    document.getElementById("newsBody").value =
    row.body || "";

    document.getElementById("newsPublished").checked =
    !!row.is_published;

    document.getElementById("newsModal")
      .classList.add("open");

  }catch(error){

    alert(
      "ニュース情報を開けませんでした。"
    );

  }

}


function closeNewsModal(){

  document.getElementById("newsModal")
    .classList.remove("open");

}

    document.getElementById("newsId").value;

  const title =
    document.getElementById("newsTitle").value.trim();

  const body =
    document.getElementById("newsBody").value;

  const published =
    document.getElementById("newsPublished").checked;

  if(!title){

    alert(
      "タイトルを入力してください。"
    );

    return;

  }

  try{

    const data = {

      title:title,

      body:body,

      is_published:published,

      published_at:
        published
        ? new Date().toISOString()
        : null

    };

    let result;

    if(id){

      result =
        awai
