<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUL Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#f5f7fb;
  color:#111;
}

header{
  background:#809CCF;
  color:white;
  padding:20px;
  font-size:22px;
  font-weight:700;
}

main{
  max-width:500px;
  margin:60px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#809CCF;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#f1f3f6;
  white-space:pre-wrap;
}

#admin{
  display:none;
}

.menu{
  display:grid;
  gap:12px;
}

.menu button{
  background:white;
  color:#111;
  border:1px solid #ddd;
  text-align:left;
}

.logout{
  background:#222!important;
  color:white!important;
}
</style>
</head>

<body>

<header>
  QUL Admin
</header>

<main>

  <!-- LOGIN -->
  <section id="login">
    <div class="card">

      <h1>管理画面ログイン</h1>

      <p>QUL管理者アカウントでログインしてください。</p>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="パスワード"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        type="button"
        onclick="login()"
      >
        ログイン
      </button>

      <div id="status">
        JavaScript確認中…
      </div>

    </div>
  </section>


  <!-- ADMIN -->
  <section id="admin">

    <div class="card">

      <h1>QUL管理画面</h1>

      <p id="userInfo"></p>

      <div class="menu">

        <button onclick="alert('ニュース管理は次の段階で追加します')">
          📰 ニュース管理
        </button>

        <button onclick="alert('プロジェクト管理は次の段階で追加します')">
          🚀 プロジェクト管理
        </button>

        <button onclick="alert('サイト設定は次の段階で追加します')">
          ⚙️ サイト設定
        </button>

        <button onclick="window.open('https://nandemostorenet.stores.jp/reserve/QUL-Group_reserve','_blank')">
          📅 予約ページ
        </button>

        <button
          class="logout"
          onclick="logout()"
        >
          ログアウト
        </button>

      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

console.log("QUL ADMIN JavaScript START");

const SUPABASE_URL =
  "https://vfdqblzbdtxbuhjxzdoq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";

let client = null;


/* -------------------------
   初期化
------------------------- */

window.addEventListener("DOMContentLoaded", function(){

  const status =
    document.getElementById("status");

  status.textContent =
    "JavaScript OK\nSupabase初期化中…";

  try{

    if(!window.supabase){

      status.textContent =
        "エラー：Supabaseライブラリを読み込めませんでした。";

      return;
    }

    client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    status.textContent =
      "JavaScript OK\nSupabase OK\nログインできます。";

    console.log("Supabase initialized");

  }catch(error){

    console.error(error);

    status.textContent =
      "初期化エラー\n" +
      error.message;

  }

});


/* -------------------------
   ログイン
------------------------- */

window.login = async function(){

  console.log("LOGIN BUTTON CLICK");

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("loginButton");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!client){

    status.textContent =
      "Supabaseが初期化されていません。";

    return;
  }

  if(!email){

    status.textContent =
      "メールアドレスを入力してください。";

    return;
  }

  if(!password){

    status.textContent =
      "パスワードを入力してください。";

    return;
  }

  button.disabled = true;

  button.textContent =
    "ログイン中…";

  status.textContent =
    "Supabaseへログインしています…";

  try{

    const result =
      await client.auth.signInWithPassword({
        email:email,
        password:password
      });

    console.log("LOGIN RESULT",result);

    if(result.error){

      throw result.error;

    }

    if(!result.data.user){

      throw new Error(
        "ユーザー情報を取得できませんでした。"
      );

    }

    status.textContent =
      "ログイン成功！\n管理画面を表示します。";

    showAdmin(result.data.user);

  }catch(error){

    console.error(error);

    status.textContent =
      "ログイン失敗\n\n" +
      error.message;

  }finally{

    button.disabled = false;

    button.textContent =
      "ログイン";

  }

};


/* -------------------------
   管理画面表示
------------------------- */

function showAdmin(user){

  document.getElementById("login").style.display =
    "none";

  document.getElementById("admin").style.display =
    "block";

  document.getElementById("userInfo").textContent =
    "ログイン中：" + user.email;

}


/* -------------------------
   ログアウト
------------------------- */

window.logout = async function(){

  try{

    await client.auth.signOut();

  }catch(error){

    console.error(error);

  }

  document.getElementById("admin").style.display =
    "none";

  document.getElementById("login").style.display =
    "block";

  document.getElementById("status").textContent =
    "ログアウトしました。";

};


/* -------------------------
   JSエラー表示
------------------------- */

window.addEventListener("error",function(event){

  console.error(event.error);

  const status =
    document.getElementById("status");

  if(status){

    status.textContent =
      "JavaScriptエラー\n\n" +
      event.message;

  }

});

</script>

</body>
</html>
