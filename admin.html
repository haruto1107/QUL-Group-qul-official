<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUL Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --blue: #809CCF;
      --blue-dark: #6383bd;
      --text: #202124;
      --sub: #6b7280;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --danger: #dc3545;
      --success: #198754;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Noto Sans JP",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top,
          rgba(128,156,207,.22),
          transparent 45%
        ),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .login-card p {
      margin: 0 0 28px;
      color: var(--sub);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      background: white;
      transition: .2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(128,156,207,.15);
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .primary-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      transition: .2s;
    }

    .primary-button:hover {
      background: var(--blue-dark);
    }

    .primary-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .login-error {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff0f1;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.6;
    }

    .login-status {
      margin-top: 15px;
      text-align: center;
      color: var(--sub);
      font-size: 13px;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminScreen {
      min-height: 100vh;
    }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .admin-header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .admin-brand-text strong {
      display: block;
      font-size: 15px;
    }

    .admin-brand-text span {
      color: var(--sub);
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-email {
      color: var(--sub);
      font-size: 12px;
    }

    .logout-button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .logout-button:hover {
      background: #f8f8f8;
    }

    .admin-container {
      max-width: 1200px;
      margin: auto;
      padding: 28px 20px 60px;
    }

    .dashboard-title {
      margin-bottom: 24px;
    }

    .dashboard-title h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .dashboard-title p {
      margin: 0;
      color: var(--sub);
      font-size: 14px;
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 22px;
      padding-bottom: 3px;
    }

    .tab-button {
      border: 0;
      background: white;
      border-radius: 12px;
      padding: 11px 17px;
      white-space: nowrap;
      color: var(--sub);
      font-weight: 700;
    }

    .tab-button.active {
      background: var(--blue);
      color: white;
    }

    .panel {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
      border: 1px solid rgba(0,0,0,.03);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .secondary-button:hover {
      background: #f8f9fb;
    }

    .save-button {
      border: 0;
      background: var(--blue);
      color: white;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
    }

    /* =========================
       NEWS / PROJECT CARDS
    ========================= */

    .item-list {
      display: grid;
      gap: 12px;
    }

    .item-card {
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
    }

    .item-card-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .item-title {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 800;
    }

    .item-body {
      margin: 0;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .item-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .edit-button,
    .delete-button {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-button {
      background: #eef3fb;
      color: #5274af;
    }

    .delete-button {
      background: #fff0f1;
      color: var(--danger);
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 800;
      margin-top: 8px;
    }

    .badge-on {
      background: #e9f7ef;
      color: var(--success);
    }

    .badge-off {
      background: #f1f2f4;
      color: #777;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.35);
    }

    .modal-card {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #f2f3f5;
      font-size: 18px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      width: auto;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-grid {
      display: grid;
      gap: 18px;
    }

    .setting-row {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-key {
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 7px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #202124;
      color: white;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 200;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.success {
      background: var(--success);
    }

    #toast.error {
      background: var(--danger);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 35px;
      color: var(--sub);
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: var(--sub);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
      .admin-header-inner {
        padding: 12px 15px;
      }

      .user-email {
        display: none;
      }

      .admin-container {
        padding: 20px 14px 45px;
      }

      .dashboard-title h1 {
        font-size: 25px;
      }

      .panel {
        padding: 16px;
        border-radius: 17px;
      }

      .item-card-top {
        flex-direction: column;
      }

      .item-actions {
        width: 100%;
      }

      .item-actions button {
        flex: 1;
      }

      .login-card {
        padding: 26px 21px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================= -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="logo">Q</div>

      <h1>QUL Admin</h1>

      <p>
        QUL Group 管理画面へログイン
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="admin@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="パスワード"
            required
          >
        </div>

        <button
          id="loginButton"
          class="primary-button"
          type="submit"
        >
          ログイン
        </button>

      </form>

      <div
        id="loginError"
        class="login-error hidden"
      ></div>

      <div
        id="loginStatus"
        class="login-status hidden"
      ></div>

    </div>

  </section>


  <!-- =========================
       ADMIN SCREEN
  ========================= -->

  <section id="adminScreen" class="hidden">

    <header class="admin-header">

      <div class="admin-header-inner">

        <div class="admin-brand">

          <div class="admin-brand-mark">
            Q
          </div>

          <div class="admin-brand-text">
            <strong>QUL Admin</strong>
            <span>Management Console</span>
          </div>

        </div>

        <div class="header-actions">

          <span
            id="userEmail"
            class="user-email"
          ></span>

          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            ログアウト
          </button>

        </div>

      </div>

    </header>


    <main class="admin-container">

      <div class="dashboard-title">
        <h1>管理画面</h1>
        <p>QUL Group のコンテンツを管理します。</p>
      </div>


      <!-- TABS -->

      <div class="tabs">

        <button
          class="tab-button active"
          data-tab="news"
          type="button"
        >
          ニュース
        </button>

        <button
          class="tab-button"
          data-tab="projects"
          type="button"
        >
          プロジェクト
        </button>

        <button
          class="tab-button"
          data-tab="settings"
          type="button"
        >
          サイト設定
        </button>

      </div>


      <!-- =========================
           NEWS
      ========================= -->

      <section
        id="panel-news"
        class="panel"
      >

        <div class="panel-header">

          <h2>ニュース管理</h2>

          <button
            id="addNewsButton"
            class="save-button"
            type="button"
          >
            ＋ ニュース追加
          </button>

        </div>

        <div
          id="newsList"
          class="item-list"
        >
          <div class="loading">
            読み込み中…
          </div>
        </div>

      </section>


      <!-- =========================
           PROJECTS
      ========================= -->

      <section
        id="panel-projects"
        class="panel hidden"
      >

        <div class="panel-header">

          <h2>プロジェクト管理</h2>

          <button
            id="addProjectButton"
            class="save-button"
            type="button"
          >
            ＋ プロジェクト追加
          </button>

        </div>

        <div
          id="projectsList"
          class="item-list"
        >
          <div class="loading">
            読み込み中…
          </div>
        </div>

      </section>


      <!-- =========================
           SETTINGS
      ========================= -->

      <section
        id="panel-settings"
        class="panel hidden"
      >

        <div class="panel-header">

          <h2>サイト設定</h2>

          <button
            id="saveSettingsButton"
            class="save-button"
            type="button"
          >
            保存
          </button>

        </div>

        <div
          id="settingsForm"
          class="settings-grid"
        >

          <div class="loading">
            読み込み中…
          </div>

        </div>

      </section>

    </main>

  </section>


  <!-- =========================
       NEWS MODAL
  ========================= -->

  <div
    id="newsModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2 id="newsModalTitle">
          ニュース追加
        </h2>

        <button
          id="closeNewsModal"
          class="close-button"
          type="button"
        >
          ×
        </button>

      </div>

      <input
        id="newsId"
        type="hidden"
      >

      <div class="form-group">

        <label for="newsTitle">
          タイトル
        </label>

        <input
          id="newsTitle"
          type="text"
          placeholder="ニュースタイトル"
        >

      </div>

      <div class="form-group">

        <label for="newsBody">
          内容
        </label>

        <textarea
          id="newsBody"
          placeholder="ニュース内容"
        ></textarea>

      </div>

      <div class="form-group">

        <label for="newsPublished">
          公開状態
        </label>

        <select id="newsPublished">
          <option value="true">公開</option>
          <option value="false">非公開</option>
        </select>

      </div>

      <div class="modal-actions">

        <button
          id="cancelNews"
          class="secondary-button"
          type="button"
        >
          キャンセル
        </button>

        <button
          id="saveNews"
          class="save-button"
          type="button"
        >
          保存
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       PROJECT MODAL
  ========================= -->

  <div
    id="projectModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2 id="projectModalTitle">
          プロジェクト追加
        </h2>

        <button
          id="closeProjectModal"
          class="close-button"
          type="button"
        >
          ×
        </button>

      </div>

      <input
        id="projectId"
        type="hidden"
      >

      <div class="form-group">

        <label for="projectName">
          プロジェクト名
        </label>

        <input
          id="projectName"
          type="text"
          placeholder="QUL Pay"
        >

      </div>

      <div class="form-group">

        <label for="projectDescription">
          説明
        </label>

        <textarea
          id="projectDescription"
          placeholder="プロジェクトの説明"
        ></textarea>

      </div>

      <div class="form-group">

        <label for="projectStatus">
          ステータス
        </label>

        <input
          id="projectStatus"
          type="text"
          placeholder="開発中"
        >

      </div>

      <div class="form-group">

        <label for="projectOrder">
          表示順
        </label>

        <input
          id="projectOrder"
          type="number"
          value="0"
        >

      </div>

      <div class="form-group">

        <label for="projectVisible">
          表示設定
        </label>

        <select id="projectVisible">
          <option value="true">表示</option>
          <option value="false">非表示</option>
        </select>

      </div>

      <div class="modal-actions">

        <button
          id="cancelProject"
          class="secondary-button"
          type="button"
        >
          キャンセル
        </button>

        <button
          id="saveProject"
          class="save-button"
          type="button"
        >
          保存
        </button>

      </div>

    </div>

  </div>


  <div id="toast"></div>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://vfdqblzbdtxbuhjxzdoq.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const adminScreen =
      document.getElementById("adminScreen");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
