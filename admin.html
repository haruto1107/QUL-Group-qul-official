<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUL Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#809CCF;
  --blue-dark:#6383bd;
  --text:#202124;
  --sub:#6b7280;
  --bg:#f5f7fb;
  --border:#e5e7eb;
  --danger:#dc3545;
  --success:#198754;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    "Noto Sans JP",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:22px;
}

.login-card h1{
  margin:0 0 7px;
  font-size:27px;
}

.login-card p{
  margin:0 0 28px;
  color:var(--sub);
  font-size:14px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:#fff;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(128,156,207,.15);
}

.login-button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
}

.login-button:hover{
  background:var(--blue-dark);
}

.login-button:disabled{
  opacity:.6;
}

.error{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#fff0f1;
  color:var(--danger);
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}

.status{
  margin-top:15px;
  text-align:center;
  color:var(--sub);
  font-size:13px;
}

/* =========================
   HEADER
========================= */

.admin-header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--blue);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:800;
}

.brand strong{
  display:block;
  font-size:15px;
}

.brand small{
  color:var(--sub);
  font-size:10px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.email{
  color:var(--sub);
  font-size:12px;
}

.logout{
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  padding:8px 12px;
  font-size:12px;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 60px;
}

.title{
  margin-bottom:22px;
}

.title h1{
  margin:0 0 5px;
  font-size:29px;
}

.title p{
  margin:0;
  color:var(--sub);
  font-size:14px;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
}

.tab{
  border:0;
  background:white;
  color:var(--sub);
  border-radius:12px;
  padding:11px 17px;
  font-weight:700;
  white-space:nowrap;
}

.tab.active{
  background:var(--blue);
  color:white;
}

/* =========================
   PANEL
========================= */

.panel{
  background:white;
  border-radius:20px;
  padding:22px;
  border:1px solid rgba(0,0,0,.03);
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

.panel-header h2{
  margin:0;
  font-size:19px;
}

.add-button,
.save-button{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
}

.cancel-button{
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
}

/* =========================
   LIST
========================= */

.list{
  display:grid;
  gap:12px;
}

.item{
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.item h3{
  margin:0 0 6px;
  font-size:16px;
}

.item p{
  margin:0;
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.edit{
  border:0;
  background:#eef3fb;
  color:#5274af;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
  font-weight:700;
}

.delete{
  border:0;
  background:#fff0f1;
  color:var(--danger);
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
  font-weight:700;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
}

.on{
  background:#e9f7ef;
  color:var(--success);
}

.off{
  background:#f1f2f4;
  color:#777;
}

.empty,
.loading{
  text-align:center;
  padding:35px;
  color:var(--sub);
  font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.38);
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  padding:24px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f1f2f4;
  font-size:18px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:20px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#202124;
  color:white;
  padding:11px 16px;
  border-radius:12px;
  font-size:13px;
  transition:.25s;
  z-index:300;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#toast.error-toast{
  background:var(--danger);
}

#toast.success-toast{
  background:var(--success);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .login-card{
    padding:25px 20px;
  }

  .container{
    padding:20px 14px 45px;
  }

  .header-inner{
    padding:12px 14px;
  }

  .email{
    display:none;
  }

  .panel{
    padding:16px;
  }

  .item-top{
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }

}
</style>
</head>

<body>

<!-- ==================================================
     LOGIN
================================================== -->

<div id="loginScreen">

  <div class="login-card">

    <div class="logo">Q</div>

    <h1>QUL Admin</h1>

    <p>QUL Group 管理画面</p>

    <div class="field">
      <label for="email">メールアドレス</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="メールアドレス"
      >
    </div>

    <div class="field">
      <label for="password">パスワード</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="パスワード"
      >
    </div>

    <!-- formではなくbuttonにする -->
    <button
      id="loginButton"
      class="login-button"
      type="button"
    >
      ログイン
    </button>

    <div
      id="loginStatus"
      class="status hidden"
    ></div>

    <div
      id="loginError"
      class="error hidden"
    ></div>

  </div>

</div>


<!-- ==================================================
     ADMIN
================================================== -->

<div id="adminScreen" class="hidden">

  <header class="admin-header">

    <div class="header-inner">

      <div class="brand">

        <div class="brand-logo">Q</div>

        <div>
          <strong>QUL Admin</strong>
          <small>Management Console</small>
        </div>

      </div>

      <div class="header-right">

        <span
          id="userEmail"
          class="email"
        ></span>

        <button
          id="logoutButton"
          class="logout"
          type="button"
        >
          ログアウト
        </button>

      </div>

    </div>

  </header>


  <main class="container">

    <div class="title">
      <h1>管理画面</h1>
      <p>QUL Group のコンテンツを管理します。</p>
    </div>


    <div class="tabs">

      <button
        class="tab active"
        data-tab="news"
        type="button"
      >
        ニュース
      </button>

      <button
        class="tab"
        data-tab="projects"
        type="button"
      >
        プロジェクト
      </button>

      <button
        class="tab"
        data-tab="settings"
        type="button"
      >
        サイト設定
      </button>

    </div>


    <!-- NEWS -->

    <section
      id="newsPanel"
      class="panel"
    >

      <div class="panel-header">

        <h2>ニュース管理</h2>

        <button
          id="addNews"
          class="add-button"
          type="button"
        >
          ＋ ニュース追加
        </button>

      </div>

      <div
        id="newsList"
        class="list"
      ></div>

    </section>


    <!-- PROJECTS -->

    <section
      id="projectsPanel"
      class="panel hidden"
    >

      <div class="panel-header">

        <h2>プロジェクト管理</h2>

        <button
          id="addProject"
          class="add-button"
          type="button"
        >
          ＋ プロジェクト追加
        </button>

      </div>

      <div
        id="projectsList"
        class="list"
      ></div>

    </section>


    <!-- SETTINGS -->

    <section
      id="settingsPanel"
      class="panel hidden"
    >

      <div class="panel-header">

        <h2>サイト設定</h2>

        <button
          id="saveSettings"
          class="save-button"
          type="button"
        >
          保存
        </button>

      </div>

      <div id="settingsList"></div>

    </section>

  </main>

</div>


<!-- ==================================================
     NEWS MODAL
================================================== -->

<div
  id="newsModal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="newsModalTitle">
        ニュース追加
      </h2>

      <button
        id="closeNews"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>

    <input
      id="newsId"
      type="hidden"
    >

    <div class="field">

      <label>タイトル</label>

      <input
        id="newsTitle"
        type="text"
        placeholder="ニュースタイトル"
      >

    </div>

    <div class="field">

      <label>内容</label>

      <textarea
        id="newsBody"
        rows="6"
        placeholder="ニュース内容"
      ></textarea>

    </div>

    <div class="field">

      <label>公開状態</label>

      <select id="newsPublished">
        <option value="true">公開</option>
        <option value="false">非公開</option>
      </select>

    </div>

    <div class="modal-actions">

      <button
        id="cancelNews"
        class="cancel-button"
        type="button"
      >
        キャンセル
      </button>

      <button
        id="saveNews"
        class="save-button"
        type="button"
      >
        保存
      </button>

    </div>

  </div>

</div>


<!-- ==================================================
     PROJECT MODAL
================================================== -->

<div
  id="projectModal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="projectModalTitle">
        プロジェクト追加
      </h2>

      <button
        id="closeProject"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>

    <input
      id="projectId"
      type="hidden"
    >

    <div class="field">

      <label>プロジェクト名</label>

      <input
        id="projectName"
        type="text"
        placeholder="QUL Pay"
      >

    </div>

    <div class="field">

      <label>説明</label>

      <textarea
        id="projectDescription"
        rows="6"
        placeholder="プロジェクトの説明"
      ></textarea>

    </div>

    <div class="field">

      <label>ステータス</label>

      <input
        id="projectStatus"
        type="text"
        placeholder="開発中"
      >

    </div>

    <div class="field">

      <label>表示順</label>

      <input
        id="projectOrder"
        type="number"
        value="0"
      >

    </div>

    <div class="field">

      <label>表示設定</label>

      <select id="projectVisible">
        <option value="true">表示</option>
        <option value="false">非表示</option>
      </select>

    </div>

    <div class="modal-actions">

      <button
        id="cancelProject"
        class="cancel-button"
        type="button"
      >
        キャンセル
      </button>

      <button
        id="saveProject"
        class="save-button"
        type="button"
      >
        保存
      </button>

    </div>

  </div>

</div>


<div id="toast"></div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://vfdqblzbdtxbuhjxzdoq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_i3DQ3L8XomaERcHOoEvGqA_AoL2Ayqn";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   ELEMENTS
================================================== */

const loginScreen =
  document.getElementById("loginScreen");

const adminScreen =
  document.getElementById("adminScreen");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginError =
  document.getElementById("loginError");

const loginStatus =
  document.getElementById("loginStatus");

const userEmail =
  document.getElementById("userEmail");


let loggingIn = false;


/* ==================================================
   HELPERS
================================================== */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function toast(message,type="success"){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.className =
    type === "error"
      ? "show error-toast"
      : "show success-toast";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      el.className = "";
    },2500);
}


function showError(message){

  loginError.textContent =
    message;

  loginError.classList.remove(
    "hidden"
  );
}


function clearError(){

  loginError.textContent = "";

  loginError.classList.add(
    "hidden"
  );
}


/* ==================================================
   SHOW LOGIN
================================================== */

function showLogin(){

  adminScreen.classList.add(
    "hidden"
  );

  loginScreen.classList.remove(
    "hidden"
  );

}


/* ==================================================
   SHOW ADMIN
================================================== */

function showAdmin(user){

  loginScreen.classList.add(
    "hidden"
  );

  adminScreen.classList.remove(
    "hidden"
  );

  userEmail.textContent =
    user?.email || "";

  loadNews();

}


/* ==================================================
   CHECK ADMIN
================================================== */

async function checkAdmin(user){

  if(!user){

    showError(
      "ログインユーザーを取得できませんでした。"
    );

    showLogin();

    return false;
  }


  const result =
    await supabaseClient
      .from("profiles")
      .select("id,role")
      .eq("id",user.id)
      .maybeSingle();


  if(result.error){

    console.error(
      result.error
    );

    showError(
      "管理者情報を取得できませんでした。\n\n" +
      result.error.message
    );

    showLogin();

    return false;
  }


  if(
    !result.data ||
    result.data.role !== "admin"
  ){

    await supabaseClient.auth.signOut();

    showError(
      "このアカウントには管理者権限がありません。"
    );

    showLogin();

    return false;
  }


  showAdmin(user);

  return true;
}


/* ==================================================
   LOGIN
   ★ FORMを使わない
================================================== */

loginButton.addEventListener(
  "click",
  async function(){

    if(loggingIn){
      return;
    }

    loggingIn = true;

    clearError();

    loginButton.disabled = true;

    loginButton.textContent =
      "ログイン中…";

    loginStatus.textContent =
      "Supabaseで認証しています…";

    loginStatus.classList.remove(
      "hidden"
    );


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    try{

      if(!email){

        throw new Error(
          "メールアドレスを入力してください。"
        );
      }

      if(!password){

        throw new Error(
          "パスワードを入力してください。"
        );
      }


      console.log(
        "QUL Admin: signInWithPassword開始"
      );


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email:email,
            password:password
          });


      console.log(
        "QUL Admin: Auth結果",
        data,
        error
      );


      if(error){

        throw error;
      }


      if(!data || !data.user){

        throw new Error(
          "認証は完了しましたが、ユーザー情報がありません。"
        );
      }


      loginStatus.textContent =
        "管理者権限を確認しています…";


      const ok =
        await checkAdmin(
          data.user
        );


      if(!ok){
        return;
      }


      loginStatus.classList.add(
        "hidden"
      );


      emailInput.value = "";
      passwordInput.value = "";


    }catch(error){

      console.error(
        "QUL Admin LOGIN ERROR:",
        error
      );


      showError(
        error?.message ||
        "ログインに失敗しました。"
      );


      loginStatus.classList.add(
        "hidden"
      );


    }finally{

      loggingIn = false;

      loginButton.disabled = false;

      loginButton.textContent =
        "ログイン";

    }

  }
);


/* ==================================================
   ENTER KEY
================================================== */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      loginButton.click();

    }

  }
);


/* ==================================================
   SESSION
================================================== */

async function checkSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if(error){

      console.error(error);

      showLogin();

      return;
    }


    if(
      data &&
      data.session &&
      data.session.user
    ){

      await checkAdmin(
        data.session.user
      );

    }else{

      show
